name: KCC Loan Automation

on:
  workflow_dispatch:   # Manual trigger from GitHub UI — only YOU can trigger this

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 hours max

    steps:

    # ── 1. Checkout code ─────────────────────────────────────────────
    - name: Checkout
      uses: actions/checkout@v4

    # ── 2. Install Chrome + display tools + cloudflared ──────────────
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y wget gnupg2 xvfb x11vnc novnc websockify curl

        # Chrome
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb http://dl.google.com/linux/chrome/deb/ stable main" | \
          sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update -qq
        sudo apt-get install -y google-chrome-stable
        google-chrome --version

        # cloudflared via official apt repo
        curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
          | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared $(lsb_release -cs) main" \
          | sudo tee /etc/apt/sources.list.d/cloudflared.list
        sudo apt-get update -qq
        sudo apt-get install -y cloudflared
        cloudflared --version
        echo "All dependencies installed ✅"

    # ── 3. Install Python dependencies ───────────────────────────────
    - name: Install Python dependencies
      run: pip install -r requirements.txt

    # ── 4. Start virtual display ─────────────────────────────────────
    - name: Start virtual display
      run: |
        Xvfb :99 -screen 0 1920x1080x24 &
        sleep 2
        echo "Xvfb started ✅"

    # ── 5. Start VNC + noVNC ─────────────────────────────────────────
    - name: Start VNC and noVNC
      run: |
        x11vnc -display :99 -forever -nopw -quiet &
        websockify --web /usr/share/novnc 6080 localhost:5900 &
        sleep 2
        echo "noVNC started ✅"

    # ── 6. Start Dashboard (with password from GitHub Secret) ────────
    - name: Start Dashboard
      env:
        DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
      run: |
        DISPLAY=:99 python src/dashboard.py &
        sleep 5
        echo "Dashboard started with password protection ✅"

    # ── 7. Start Cloudflare tunnels & print URLs ─────────────────────
    - name: Start Cloudflare tunnels and show URLs
      run: |
        cloudflared tunnel --url http://localhost:5000 > /tmp/cf_dash.log 2>&1 &
        cloudflared tunnel --url http://localhost:6080 > /tmp/cf_vnc.log 2>&1 &

        echo "Waiting for tunnels to start..."
        sleep 20

        DASHBOARD_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf_dash.log | head -1)
        VNC_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf_vnc.log | head -1)

        echo ""
        echo "========================================================"
        echo "  KCC AUTOMATION IS READY!"
        echo "========================================================"
        echo ""
        echo "  DASHBOARD  ->  $DASHBOARD_URL"
        echo "  (Password protected - share with operators)"
        echo ""
        echo "  VNC        ->  $VNC_URL/vnc.html"
        echo "  (Login to fasalrin.gov.in here)"
        echo ""
        echo "  PASSWORD   ->  set in GitHub Secrets"
        echo "  NOTE: URLs change every run - copy them now!"
        echo "========================================================"

    # ── 8. Keep alive ────────────────────────────────────────────────
    - name: Keep alive
      run: |
        echo "Automation is running - job stays alive for 6 hours max"
        sleep 21600
