name: KCC Loan Automation

on:
  workflow_dispatch:   # Manual trigger from GitHub UI

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 hours max

    steps:

    # ── 1. Checkout code ─────────────────────────────────────────────
    - name: Checkout
      uses: actions/checkout@v4

    # ── 2. Install Chrome + virtual display + noVNC ──────────────────
    - name: Install Chrome and display tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y wget gnupg2 xvfb x11vnc novnc websockify
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb http://dl.google.com/linux/chrome/deb/ stable main" | \
          sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update -qq
        sudo apt-get install -y google-chrome-stable
        google-chrome --version

    # ── 3. Install Python dependencies ───────────────────────────────
    - name: Install Python dependencies
      run: pip install -r requirements.txt

    # ── 4. Download cloudflared (Linux) ──────────────────────────────
    - name: Download cloudflared
      run: |
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
          -O cloudflared
        chmod +x cloudflared
        echo "cloudflared ready"

    # ── 5. Start virtual display (Xvfb) ─────────────────────────────
    - name: Start virtual display
      run: |
        Xvfb :99 -screen 0 1920x1080x24 &
        sleep 2
        echo "Xvfb started on :99"

    # ── 6. Start VNC + noVNC ─────────────────────────────────────────
    - name: Start VNC and noVNC
      run: |
        x11vnc -display :99 -forever -nopw -quiet &
        websockify --web /usr/share/novnc 6080 localhost:5900 &
        sleep 2
        echo "noVNC started on port 6080"

    # ── 7. Start Dashboard ───────────────────────────────────────────
    - name: Start Dashboard
      run: |
        DISPLAY=:99 python src/dashboard.py &
        sleep 5
        echo "Dashboard started on port 5000"

    # ── 8. Start Cloudflare tunnels & print URLs ─────────────────────
    - name: Start Cloudflare tunnels and show URLs
      run: |
        ./cloudflared tunnel --url http://localhost:5000 > /tmp/cf_dash.log 2>&1 &
        ./cloudflared tunnel --url http://localhost:6080 > /tmp/cf_vnc.log 2>&1 &

        echo "Waiting for tunnels..."
        sleep 20

        DASHBOARD_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf_dash.log | head -1)
        VNC_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf_vnc.log | head -1)

        echo ""
        echo "========================================================"
        echo "  ✅  KCC AUTOMATION IS READY!"
        echo "========================================================"
        echo ""
        echo "  📊  DASHBOARD  →  $DASHBOARD_URL"
        echo "      (Upload data + click Run Automation here)"
        echo ""
        echo "  🖥️   VNC        →  $VNC_URL/vnc.html"
        echo "      (Login to fasalrin.gov.in here)"
        echo ""
        echo "  ⚠️   URLs change every run — copy them now!"
        echo "========================================================"

    # ── 9. Keep alive for 6 hours ────────────────────────────────────
    - name: Keep alive
      run: |
        echo "Automation is running... job will stay alive for 6 hours"
        echo "Check URLs above to access dashboard and VNC"
        sleep 21600
